<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- מסך הבית -->
    <div id="home-screen" class="screen active">
        <header class="app-header">
            <h1>Universe</h1>
        </header>
        <main class="container">
            <div class="main-actions">
                <!-- הכפתור כעת מפעיל את מנגנון ההופעה -->
                <button class="btn primary full-width" onclick="app.performance.start()">הפעל הופעה</button>
                <button class="btn secondary full-width" onclick="app.navigate('rehearsal')">תרגול</button>
            </div>
            
            <div class="settings-list">
                <div class="card clickable" onclick="app.navigate('settings-target')">
                    <div class="card-content">
                        <h3>מספר יעד וימי הולדת</h3>
                        <p class="text-dim">הגדרת תוצאת השיא ואופן החשיפה</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- מסך מספר יעד וימי הולדת -->
    <div id="settings-target-screen" class="screen">
        <header class="app-header has-back">
            <button class="btn ghost" onclick="app.navigate('home')">חזור</button>
            <h2>מספר יעד וימי הולדת</h2>
        </header>
        <main class="container">
            <div class="card">
                <div class="input-group">
                    <label for="forceNumber">מספר יעד</label>
                    <input type="number" id="forceNumber" placeholder="הכנס מספר (למשל 100)" onchange="app.updateSetting('forceNumber', this.value)">
                </div>
            </div>
        </main>
    </div>

    <!-- מסך הופעה דיסקרטי -->
    <div id="performance-screen" class="screen performance-mode">
        <!-- מחוון מצב -->
        <div id="status-indicator" class="indicator waiting"></div>
        
        <!-- אזור חשיפת התוצאה -->
        <div id="reveal-container" class="hidden" onclick="app.performance.handleScreenTap()">
            <div id="peak-number"></div>
        </div>

        <!-- אזור מרכזי נסתר להצגת התוצאה בלחיצה -->
        <div class="secret-trigger" onclick="app.performance.handleScreenTap()"></div>

        <!-- מחוות יציאה בפינה השמאלית התחתונה -->
        <div class="secret-exit" onpointerdown="app.performance.exit(event)"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
